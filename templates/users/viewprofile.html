{% extends "users/userindex.html" %}
{% block body %}
  <div class="container mt-5">
    <div class="card shadow-lg">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">My Profile</h4>
      </div>
      <div class="card-body">
        <div class="row">
          <!-- Profile Picture -->
          <div class="col-md-4 text-center">
            <img src="{{ data.photo }}" class="staff-photo">
            <h5 class="mt-2">{{ data.name }}</h5>

          </div>

          <!-- Profile Details -->
          <div class="col-md-8">
            <table class="table table-borderless">
{#                 <tr>#}
{#                <th>photo:</th>#}
{#                <td><img src="{{ data.photo }}" height="100px" width="100px"></td>#}
{#              </tr>#}
              <tr>
                <th> Name:</th>
                <td>{{ data.name }}</td>
              </tr>
                <tr>
                <th> Gender:</th>
                <td>{{ data.gender }}</td>
              </tr>
                <tr>
                <th> Date of Birth:</th>
                <td>{{ data.dob }}</td>
              </tr>
              <tr>
                <th>Email:</th>
                <td>{{ data.email }}</td>
              </tr>
              <tr>
                <th>Phone:</th>
                <td>{{ data.phone }}</td>
              </tr>






            </table>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
