{% extends "users/userindex.html" %}
{% block body %}

<style>
    body {
        background-color: #f4f7fc;
    }

    .profile-container {
        margin-top: 60px;
        margin-bottom: 60px;
    }

    .profile-card {
        border-radius: 12px;
        border: none;
        box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        background: #ffffff;
    }

    .profile-header {
        background-color: #0a192f;
        color: white;
        padding: 18px 25px;
        font-size: 22px;
        font-weight: 600;
    }

    .staff-photo {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 5px solid #1f3c88;
        object-fit: cover;
        margin-top: 10px;
    }

    .profile-name {
        margin-top: 15px;
        font-weight: 600;
        color: #0a192f;
    }

    .profile-table th {
        color: #0a192f;
        width: 200px;
        padding: 12px;
        font-weight: 600;
    }

    .profile-table td {
        color: #555;
        padding: 12px;
    }

    .profile-table tr {
        border-bottom: 1px solid #eee;
    }
</style>

<div class="container profile-container">
    <div class="card profile-card">

        <div class="profile-header">
            My Profile
        </div>

        <div class="card-body">
            <div class="row">

                <!-- Profile Photo -->
                <div class="col-md-4 text-center">
                    <img src="{{ data.photo }}" class="staff-photo">
                    <h4 class="profile-name">{{ data.name }}</h4>
                </div>

                <!-- Profile Details -->
                <div class="col-md-8">
                    <table class="table profile-table">
                        <tr>
                            <th>Name</th>
                            <td>{{ data.name }}</td>
                        </tr>
                        <tr>
                            <th>Gender</th>
                            <td>{{ data.gender }}</td>
                        </tr>
                        <tr>
                            <th>Date of Birth</th>
                            <td>{{ data.dob }}</td>
                        </tr>
                        <tr>
                            <th>Email</th>
                            <td>{{ data.email }}</td>
                        </tr>
                        <tr>
                            <th>Phone</th>
                            <td>{{ data.phone }}</td>
                        </tr>
                    </table>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
