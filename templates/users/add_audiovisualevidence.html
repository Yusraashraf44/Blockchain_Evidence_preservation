<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Visual Evidence</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: linear-gradient(to right, #1e293b, #0f172a);
  font-family: 'Segoe UI', sans-serif;
  color: #f1f5f9;
  padding-top: 40px;
  min-height: 100vh;
}

.container {
  background-color: rgba(255, 255, 255, 0.05);
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  max-width: 700px;
  margin: auto;
  color: #e2e8f0;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

h4 {
  text-align: center;
  margin-bottom: 30px;
  color: #ffffff;
  font-weight: 700;
}

label {
  font-weight: 500;
  color: #cbd5e1;
}

label::after {
  content: " *";
  color: #f87171;
}

.form-control {
  border-radius: 10px;
  padding: 10px 15px;
  border: 1px solid #cbd5e1;
  background-color: rgba(255, 255, 255, 0.9);
  color: #0f172a;
}

.form-control:focus {
  box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.4);
  border-color: #38bdf8;
}

.btn-primary {
  background-color: #38bdf8;
  border: none;
  padding: 10px 20px;
  font-weight: 600;
  border-radius: 8px;
  color: #0f172a;
}

.btn-primary:hover {
  background-color: #0ea5e9;
  color: #ffffff;
}
</style>

</head>

<body>

<div class="container">
  <h4>Add Audiovisual Evidence</h4>

  <form method="post" action="/myapp/add_audiovisualevidence_post/" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="caseid" value="{{ id }}">

    <!-- File -->
    <div class="mb-3">
      <label>File</label>
      <input type="file" class="form-control" name="file_name" required>
    </div>

    <!-- Media Type -->
    <div class="mb-3">
      <label>--Media Type--</label>
      <select class="form-control" name="media_type" required>
        <option value="Cctv recordings">Cctv recordings</option>
        <option value="Audio recordings">Audio recordings</option>
        <option value="Video clips">Video clips</option>
        <option value="Body camera footage">Body camera footage</option>
      </select>
    </div>

    <!-- Duration -->
    <div class="mb-3">
      <label>Duration seconds</label>
      <input type="text" class="form-control" name="duration_seconds" required>
    </div>

    <!-- Format -->
    <div class="mb-3">
      <label>Format</label>
      <select class="form-control" name="format" required>
        <option value="">-- Select Format --</option>
        <option value="MP4">MP4</option>
        <option value="MP3">MP3</option>
      </select>
    </div>

    <!-- Collected From -->
    <div class="mb-3">
      <label>Collected From</label>
      <input type="text" class="form-control" name="collected_from" required>
    </div>

    <!-- Date + Time -->
    <div class="mb-3">
      <label>Collected At</label>
      <input type="datetime-local" class="form-control" name="collected_at" required>
    </div>

    <!-- File Hash -->
    <div class="mb-3">
      <label>File Hash</label>
      <input type="text" class="form-control" name="file_hash" required>
    </div>

    <!-- Submit -->
    <div class="text-center">
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
