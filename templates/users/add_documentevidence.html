<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>document evidence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h4 class="mb-4">Add Document Evidence</h4>
    <form method="post" action="/myapp/add_documentevidence_post/" enctype="multipart/form-data">
        {% csrf_token %}
      
     <input type="hidden" name="caseid" value="{{ id }}">

      <!-- Complaint Text -->
 <div class="mb-3">
          <div class="form-group">
                        <label for="File name">File name</label>
                        <input type="file" class="form-control" id="File name" name="File name" placeholder="" required accept="application/pdf">
                    </div>
      <div class="mb-3">
          <div class="form-group">

        <label for="send" class="form-label">Document Type</label>
        <select class="form-control" id="" name="Document Type" rows="4" placeholder="" required>
            <option value="Contracts">Contracts</option>
              <option value="Threat letters">Threat letters</option>
              <option value="Suicide notes">Suicide notes</option>
              <option value="Forged documents">Forged documents</option>
              <option value="Handwritten notes">Handwritten notes</option>



        </select>
      </div>
      <div class="form-group">
                        <label for="Title">Title</label>
                        <input type="text" class="form-control" id="Title" name="Title" placeholder="" required>
                    </div>
                     <div class="form-group">
                        <label for="Pages">Pages</label>
                        <input type="text" class="form-control" id="Pages" name="Pages" placeholder="" required>
                    </div>
         <div class="form-group">
                        <label for="Collected from">Collected_from</label>
                        <input type="text" class="form-control" id="Collected from" name="Collected from" placeholder="" required>
                    </div>
        <div class="form-group">
                        <label for="Collected at">Collected_at</label>
                        <input type="text" class="form-control" id="Collected at" name="Collected at" placeholder="" required>
                    </div>
          <div class="form-group">
                        <label for="file hash">File hash</label>
                        <input type="text" class="form-control" id="file hash" name="file hash" placeholder="" required>
                    </div>









      <!-- Optional File Upload -->

      <!-- Submit Button -->
           <button type="submit" class="btn btn-primary">Submit</button>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
