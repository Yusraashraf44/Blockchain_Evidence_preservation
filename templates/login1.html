<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Evidence System - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("{% static 'login/img/loggoo.jpg' %}") no-repeat center center/cover;
        }

        /* Glass Login Box */
        .login-box {
            width: 380px;
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.55);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            color: #fff;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            font-size: 13px;
            margin-bottom: 25px;
            color: #ddd;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }

        .btn:hover {
            background: #e68900;
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
            font-size: 12px;
        }

        .forgot a {
            color: #ffcc80;
            text-decoration: none;
        }

        .error {
            color: #ff8080;
            text-align: center;
            margin-top: 10px;
        }

        .security-text {
            font-size: 11px;
            text-align: center;
            margin-top: 15px;
            color: #ccc;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Digital Evidence System</h2>
    <p>Secure Login Portal</p>

    <form method="post" action="/myapp/login_post/">
        {% csrf_token %}
        <div class="input-box">
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <input type="submit" value="Login" class="btn">

        <div class="forgot">
            <a href="/myapp/forgotpassword_get/">Forgot Password?</a>
        </div>
    </form>

    <p class="security-text">
        Unauthorized access is prohibited.
    </p>

    {% for i in messages %}
        <div class="error">{{ i }}</div>
    {% endfor %}
</div>

</body>
</html>
