<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assigned Case</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- DataTables CSS -->
<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<style>
body {
    background-color: #f8fafc; /* light neutral background */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 30px 0;
}

/* Container */
.container {
    margin-top: 30px;
}

/* Title */
h2 {
    color: #0f172a;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
}

/* Table Styling */
table {
    border-collapse: separate !important;
    border-spacing: 0 6px;
}

thead th {
    background-color: #0d6efd; /* header blue */
    color: #fff;
    border-radius: 6px 6px 0 0;
    padding: 10px;
    text-align: center;
}

tbody td {
    background-color: #ffffff; /* table body white */
    vertical-align: middle;
    border: none;
    padding: 10px;
    border-radius: 6px;
}

tbody tr:hover td {
    background-color: #e2e6ea; /* subtle hover effect */
}

/* Buttons */
.btn-custom {
    border-radius: 5px;
    font-size: 0.85rem;
    padding: 5px 10px;
    margin-bottom: 3px;
    transition: 0.3s;
}

.btn-edit {
    background-color: #0d6efd; /* professional blue */
    color: #fff;
    border: none;
}
.btn-edit:hover { background-color: #0b5ed7; }

.btn-delete {
    background-color: #dc3545; /* red for delete */
    color: #fff;
    border: none;
}
.btn-delete:hover { background-color: #b02a37; }

@media (max-width: 992px) {
    .table-responsive {
        overflow-x: auto;
    }
}
</style>
</head>
<body>

<div class="container">
    <h2>Assigned Case</h2>
    <div class="table-responsive">
        <table id="registrationTable" class="table table-bordered table-striped table-hover">
            <thead>
                <tr>
                    <th>Sl.No</th>
                    <th>Case Number</th>
                    <th>Assigned To</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for i in data %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ i.CASE.case_number }}</td>
                    <td>{{ i.USERS.name }}</td>
                    <td>
                        <a href="/myapp/editassigncase_get/{{ i.id }}" class="btn btn-edit btn-custom btn-sm">Edit</a>
                        <a href="/myapp/deleteassignedcase_get/{{ i.id }}" class="btn btn-delete btn-custom btn-sm">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script>
$(document).ready(function () {
    $('#registrationTable').DataTable({
        pageLength: 5,
        lengthMenu: [5, 10, 25, 50],
        ordering: true
    });
});
</script>
</body>
</html>
