<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Staff</title>

<!-- Bootstrap CSS -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- DataTables CSS -->

<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#eef2f7,#dbeafe);
font-family:Segoe UI, Arial, sans-serif;
}

/* Card Container */
.table-container{
max-width:1100px;
margin:auto;
margin-top:60px;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

/* Page Title */
.page-title{
text-align:center;
color:#0d6efd;
font-weight:600;
margin-bottom:25px;
}

/* Table Header */
table thead{
background:#0d6efd;
color:white;
}

/* Staff Image */
.staff-photo{
border-radius:6px;
width:60px;
}

/* Buttons */
.btn-edit{
background:#ffc107;
border:none;
color:black;
}

.btn-edit:hover{
background:#e0a800;
}

.btn-delete{
background:#dc3545;
border:none;
color:white;
}

.btn-delete:hover{
background:#bb2d3b;
}

</style>

</head>

<body>

<div class="table-container">

<h2 class="page-title">Registered Staff</h2>

<table id="registrationTable" class="table table-striped table-bordered">

<thead>
<tr>
<th>#</th>
<th>Name</th>
<th>Gender</th>
<th>DOB</th>
<th>Email</th>
<th>Phone</th>
<th>Photo</th>
<th>Action</th>
</tr>
</thead>

<tbody>

{% for i in data %}

<tr>
<td>{{ forloop.counter }}</td>
<td>{{ i.name }}</td>
<td>{{ i.gender }}</td>
<td>{{ i.dob }}</td>
<td>{{ i.email }}</td>
<td>{{ i.phone }}</td>

<td>
<img src="{{ i.photo }}" class="staff-photo">
</td>

<td>

<a href="/myapp/editstaff_get/{{ i.id }}" class="btn btn-edit btn-sm">Edit</a>

<a href="/myapp/deletestaff_get/{{ i.AUTHUSER.id }}" class="btn btn-delete btn-sm">Delete</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<!-- Scripts -->

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>

$(document).ready(function () {

$('#registrationTable').DataTable({
pageLength:5,
lengthMenu:[5,10,25,50],
ordering:true
});

});

</script>

</body>
</html>
