<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assign Case</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #1e293b, #0f172a);
      font-family: 'Segoe UI', sans-serif;
      color: #f1f5f9;
      padding-top: 40px;
      min-height: 100vh;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      max-width: 700px;
      margin: auto;
      color: #e2e8f0;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #ffffff;
      font-weight: 700;
    }

    label {
      font-weight: 500;
      color: #cbd5e1;
    }

    label::after {
      content: " *";
      color: #f87171;
    }

    .form-select {
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      background-color: rgba(255, 255, 255, 0.9);
      color: #0f172a;
    }

    .form-select:focus {
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.4);
      border-color: #38bdf8;
    }

    .btn-primary {
      background-color: #38bdf8;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.3s ease;
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: #0ea5e9;
      color: #ffffff;
    }

    @media (max-width: 576px) {
      .container {
        padding: 20px;
      }

      label {
        text-align: left !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Assign Case</h2>
    <form method="post" action="/myapp/assigncase_post/">
      {% csrf_token %}

      <div class="row mb-3">
        <label for="staff" class="col-sm-4 col-form-label">Staff</label>
        <div class="col-sm-8">
          <select id="staff" class="form-select" name="staff" required>
            {% for i in staff %}
              <option value="{{ i.id }}">{{ i.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <label for="case" class="col-sm-4 col-form-label">Case</label>
        <div class="col-sm-8">
          <select id="case" class="form-select" name="case" required>
            {% for i in case %}
              <option value="{{ i.id }}">{{ i.case_title }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Assign</button>
        </div>
      </div>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
