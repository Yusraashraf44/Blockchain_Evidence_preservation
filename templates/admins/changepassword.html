<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: none;
        }

        .card-header {
            background: #4e73df;
            color: white;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            border-radius: 12px 12px 0 0;
            padding: 15px;
        }

        .card-body {
            padding: 25px;
        }

        .form-control {
            border-radius: 6px;
        }

        .btn-primary {
            border-radius: 6px;
            font-weight: 500;
        }

        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 38px;
            font-size: 14px;
            color: #6c757d;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="card-header">
        🔐 Change Password
    </div>

    <div class="card-body">
        <form method="post" action="/myapp/changepassword_post/">
            {% csrf_token %}

            <div class="form-group position-relative">
                <label>Current Password</label>
                <input type="password" class="form-control" id="currentpassword" name="currentpassword" required>
                <span class="password-toggle" onclick="togglePassword('currentpassword')">👁</span>
            </div>

            <div class="form-group position-relative">
                <label>New Password</label>
                <input type="password" class="form-control" id="newpassword" name="newpassword" required>
                <span class="password-toggle" onclick="togglePassword('newpassword')">👁</span>
            </div>

            <div class="form-group position-relative">
                <label>Confirm Password</label>
                <input type="password" class="form-control" id="confirmpassword" name="confirmpassword" required>
                <span class="password-toggle" onclick="togglePassword('confirmpassword')">👁</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-3">
                Update Password
            </button>
        </form>

        <!-- Messages -->
        {% if messages %}
            {% for i in messages %}
                <div class="alert alert-danger mt-3 text-center">
                    {{ i }}
                </div>
            {% endfor %}
        {% endif %}
    </div>
</div>

<script>
function togglePassword(id) {
    var x = document.getElementById(id);
    if (x.type === "password") {
        x.type = "text";
    } else {
        x.type = "password";
    }
}
</script>

</body>
</html>
