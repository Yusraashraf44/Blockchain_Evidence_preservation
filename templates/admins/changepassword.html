<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            background-color: #ffffff;
        }

        h2 {
            color: #0d6efd;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-control {
            border-radius: 6px;
            padding: 10px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 5px rgba(13, 110, 253, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
        }

        .messages {
            margin-top: 15px;
            text-align: center;
            color: #dc3545; /* Red for errors */
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Change Password</h2>
    <form method="post" action="/myapp/changepassword_post/">
        {% csrf_token %}

        <div class="form-group mb-3">
            <label for="currentpassword">Current Password</label>
            <input type="password" class="form-control" id="currentpassword" name="currentpassword" placeholder="Enter your current password" required>
        </div>

        <div class="form-group mb-3">
            <label for="newpassword">New Password</label>
            <input type="password" class="form-control" id="newpassword" name="newpassword" placeholder="Enter your new password" required>
        </div>

        <div class="form-group mb-3">
            <label for="confirmpassword">Confirm Password</label>
            <input type="password" class="form-control" id="confirmpassword" name="confirmpassword" placeholder="Enter your confirmed password" required>
        </div>

        <button type="submit" class="btn btn-primary">Update Password</button>
    </form>

    {% if messages %}
    <div class="messages">
        {% for i in messages %}
            {{ i }}<br>
        {% endfor %}
    </div>
    {% endif %}
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
