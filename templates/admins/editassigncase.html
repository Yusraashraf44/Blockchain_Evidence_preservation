<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Assign Case</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  background: linear-gradient(to right, #1e293b, #0f172a);
  font-family: 'Segoe UI', sans-serif;
  color: #f1f5f9;
  padding-top: 40px;
  min-height: 100vh;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 40px;
  border-radius: 16px;
  background-color: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1);
}

h2 {
  text-align: center;
  color: #ffffff;
  font-weight: 700;
  margin-bottom: 30px;
}

label {
  font-weight: 500;
  color: #cbd5e1;
}

label::after {
  content: " *";
  color: #f87171;
}

.form-control {
  border-radius: 10px;
  padding: 10px 15px;
  font-size: 1rem;
  border: 1px solid #cbd5e1;
  background-color: rgba(255,255,255,0.9);
  color: #0f172a;
}

.form-control:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 0 4px rgba(56,189,248,0.4);
}

.btn-primary {
  width: 150px;
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  background-color: #38bdf8;
  border: none;
  color: #0f172a;
  font-weight: 600;
  transition: background-color 0.3s ease;
}

.btn-primary:hover {
  background-color: #0ea5e9;
  color: #ffffff;
}

.row {
  margin-bottom: 12px;
}

@media (max-width: 576px) {
  .container {
    padding: 20px;
  }
}
</style>
</head>
<body>

<div class="container">
<h2>Edit Assign Case</h2>

<form method="post" action="/myapp/editassigncase_post/">
  {% csrf_token %}
  <input type="hidden" name="id" value="{{ d.id }}">

  <div class="row mb-3">
    <label for="staff" class="col-sm-4 col-form-label">Staff</label>
    <div class="col-sm-8">
      <select class="form-control" name="staff">
        {% for i in staff %}
          <option value="{{ i.id }}" {% if d.USERS.id == i.id %}selected{% endif %}>{{ i.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <label for="case" class="col-sm-4 col-form-label">Case</label>
    <div class="col-sm-8">
      <select class="form-control" name="case">
        {% for i in case %}
          <option value="{{ i.id }}" {% if d.CASE.id == i.id %}selected{% endif %}>{{ i.case_title }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <div class="offset-sm-4 col-sm-8">
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
  </div>

</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
